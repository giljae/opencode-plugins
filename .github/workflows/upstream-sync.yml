name: Upstream sync and publish

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      verify_token:
        description: "Only verify that NPM_TOKEN can authenticate, then stop"
        type: boolean
        default: false
      test_publish:
        description: "Publish a prerelease under the 'test' tag; does not touch main or 'latest'"
        type: boolean
        default: false
      package_filter:
        description: "Limit to one package directory name (for test_publish)"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm ci

      - name: Verify NPM_TOKEN
        if: inputs.verify_token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          user=$(npm whoami --registry https://registry.npmjs.org/)
          echo "NPM_TOKEN authenticates as: $user"

      - name: Find packages to publish
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
          FILTER: ${{ inputs.package_filter }}
          TEST_PUBLISH: ${{ inputs.test_publish }}
        run: |
          node scripts/upstream-status.mjs > /tmp/upstream-status.json
          node -e '
            const status = require("/tmp/upstream-status.json");
            const filter = process.env.FILTER || "";
            const testPublish = process.env.TEST_PUBLISH === "true";
            let list = status.filter((pkg) => pkg.changed || testPublish);
            if (filter) {
              list = list.filter((pkg) => pkg.plugin.endsWith("/" + filter));
            }
            console.log("dirs=" + list.map((pkg) => pkg.plugin).join(" "));
          ' >> "$GITHUB_OUTPUT"

      - name: Report no change
        if: steps.changed.outputs.dirs == ''
        run: echo "No upstream changes; nothing to do."

      - name: Sync, test, bump, and publish
        if: steps.changed.outputs.dirs != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TEST_PUBLISH: ${{ inputs.test_publish }}
        run: |
          set -euo pipefail
          for dir in ${{ steps.changed.outputs.dirs }}; do
            name=$(node -p "require('./$dir/package.json').name")
            echo "::group::$name"
            if [ "$TEST_PUBLISH" != "true" ]; then
              node scripts/sync.mjs --plugin "$dir"
            fi
            npm test
            if [ "$TEST_PUBLISH" = "true" ]; then
              npm version prerelease --preid test --workspace "$name" --no-git-tag-version
            else
              npm version minor --workspace "$name" --no-git-tag-version
            fi
            version=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version already published; skipping"
            elif [ "$TEST_PUBLISH" = "true" ]; then
              npm publish --workspace "$name" --access public --tag test
            else
              npm publish --workspace "$name" --access public
            fi
            echo "::endgroup::"
          done

      - name: Commit, tag, and push
        if: steps.changed.outputs.dirs != '' && inputs.test_publish != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages
          git commit -m "chore: sync upstream releases"
          for dir in ${{ steps.changed.outputs.dirs }}; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            git tag "${name}@${version}"
          done
          git push --follow-tags
